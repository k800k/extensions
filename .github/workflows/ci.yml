name: extension-contracts
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 3"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run bundle
      - run: npm run docs:check
      - run: npm run docs:build
      - name: Verify publisher signature when present
        shell: bash
        run: |
          if [[ -f dist/v1/stable/mangareader-repository.sig ]]; then
            npm run publish:dry-run
          else
            echo "Publisher signature is absent; publication remains gated."
          fi
      - name: Verify generated outputs are committed
        shell: bash
        run: |
          generated_status="$(git status --porcelain --untracked-files=all -- dist site repository.config.json)"
          if [[ -n "$generated_status" ]]; then
            echo "$generated_status"
            exit 1
          fi
