name: pages
on:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build packages at the exact published source revision
        run: npm run bundle
        env:
          MR_SOURCE_REVISION: ${{ github.sha }}
      - run: npm run docs:build
      - uses: actions/configure-pages@v5
      - run: mkdir _site && cp -R site/. _site/ && cp -R dist _site/dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
